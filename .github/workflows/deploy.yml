name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        # The committed lockfile references Lovable's internal npm mirror, which
        # GitHub runners cannot reach — resolve from the public registry instead.
        run: bun install --no-frozen-lockfile
        env:
          BUN_CONFIG_REGISTRY: https://registry.npmjs.org/

      - name: Show build tooling version
        run: bun pm ls | grep -i tanstack-config || true

      - name: Build project
        run: bun run build
        env:
          BUN_CONFIG_REGISTRY: https://registry.npmjs.org/
          # Served from the custom domain root (experienceforall.ro).
          BASE_PATH: /


      - name: Collect static output
        run: |
          echo "::group::Build tree"
          ls -la . || true
          ls -la dist || true
          ls -la .output || true
          echo "::endgroup::"
          SITE=""
          for c in dist/client .output/public dist/public dist/static build/client dist; do
            if [ -f "$c/index.html" ]; then SITE="$c"; break; fi
          done
          if [ -z "$SITE" ]; then
            SITE=$(dirname "$(find . -path ./node_modules -prune -o -name index.html -print 2>/dev/null | grep -v '^./public/' | head -n 1)")
          fi
          if [ -z "$SITE" ] || [ ! -f "$SITE/index.html" ]; then
            echo "::error::No static site found (no index.html in build output)."
            exit 1
          fi
          echo "Using static output: $SITE"
          rm -rf _site
          mkdir -p _site
          cp -r "$SITE"/. _site/
          touch _site/.nojekyll
          ls -la _site

      - name: Vendor image assets
        # Images are referenced as root-relative /__l5e/... URLs served by the
        # Lovable preview host. GitHub Pages cannot serve them, so download each
        # file into the site and rewrite references to include the repo prefix.
        env:
          PREVIEW_HOST: https://id-preview--e59d7c5b-e791-4540-b4d5-311f72a9629d.lovable.app
          REPO: ${{ github.event.repository.name }}
        run: |
          set -e
          cd _site
          grep -rhoE '/__l5e/[A-Za-z0-9._/-]+' . --include='*.html' --include='*.js' --include='*.css' \
            | sort -u > /tmp/asset_paths.txt
          echo "Found $(wc -l < /tmp/asset_paths.txt) asset paths"
          while read -r p; do
            [ -z "$p" ] && continue
            mkdir -p ".$(dirname "$p")"
            curl -sf --retry 3 -o ".$p" "$PREVIEW_HOST$p" || echo "::warning::Could not download $p"
          done < /tmp/asset_paths.txt
          # Point every reference at /<repo>/__l5e/... (root-relative breaks under a project subpath)
          grep -rl '/__l5e/' . --include='*.html' --include='*.js' --include='*.css' \
            | xargs -r sed -i "s|/__l5e/|/${REPO}/__l5e/|g"
          echo "Vendored files:"; find . -path './__l5e/*' -type f | wc -l

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "${{ github.workspace }}/_site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
