name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build project
        run: bun run build
        env:
          # GitHub Pages serves the site at /<repo-name>/ — assets must point there.
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: Verify build output
        run: |
          echo "::group::Build output"
          ls -la dist
          ls -la dist/client || true
          echo "::endgroup::"
          if [ ! -d dist/client ] || [ -z "$(ls -A dist/client 2>/dev/null)" ]; then
            echo "::error::dist/client is missing or empty — build did not produce a static site."
            exit 1
          fi

      - name: Add .nojekyll
        run: touch dist/client/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "${{ github.workspace }}/dist/client"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
