name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build project
        run: bun run build
        env:
          # GitHub Pages serves the site at /<repo-name>/ — assets must point there.
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: Collect static output
        run: |
          echo "::group::Build tree"
          ls -la . || true
          ls -la dist || true
          ls -la .output || true
          echo "::endgroup::"
          SITE=""
          for c in dist/client .output/public dist/public dist/static build/client dist; do
            if [ -f "$c/index.html" ]; then SITE="$c"; break; fi
          done
          if [ -z "$SITE" ]; then
            SITE=$(dirname "$(find . -path ./node_modules -prune -o -name index.html -print 2>/dev/null | grep -v '^./public/' | head -n 1)")
          fi
          if [ -z "$SITE" ] || [ ! -f "$SITE/index.html" ]; then
            echo "::error::No static site found (no index.html in build output)."
            exit 1
          fi
          echo "Using static output: $SITE"
          rm -rf _site
          mkdir -p _site
          cp -r "$SITE"/. _site/
          touch _site/.nojekyll
          ls -la _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "${{ github.workspace }}/_site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
